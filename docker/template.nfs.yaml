services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:${FRIGATE_VERSION_TAG:-stable-standard-arm64}
    restart: unless-stopped
    # 1024 MB shared memory is recommended for 16+ cameras with ffmpeg
    shm_size: "1024mb"
    # Give Frigate time to close the SQLite database cleanly on restart.
    stop_grace_period: 60s

    labels:
      # Watched by the autoheal sidecar below.
      - autoheal=true

    volumes:
      - /etc/localtime:/etc/localtime:ro

      # 1. Config — lives on this machine's local SSD.
      #    Frigate keeps frigate.db here too (it has no database.path override),
      #    so the database is already off the network drive.
      - ${LOCAL_CONFIG_DIR}:/config

      # 2. Storage/stream healthcheck — see the healthcheck: block below
      - ./docker:/opt/frigate-scripts:ro

      # 3. Media — NFS-backed Docker volume (nocopy avoids permission init race)
      - type: volume
        source: nfs_storage_volume
        target: /media/frigate
        volume:
          nocopy: true

      # Optional local additions. setup.sh regenerates this file from the
      # template, so anything you add to docker-compose.yaml by hand must be
      # mirrored here or it will be silently dropped on the next run.
      # - ./web/dist/:/opt/frigate/web:ro
      # - ./config/certs/fullchain.pem:/etc/letsencrypt/live/frigate/fullchain.pem:ro
      # - ./config/certs/privkey.pem:/etc/letsencrypt/live/frigate/privkey.pem:ro
    ports:
      - "8971:8971"   # Authenticated Web UI
      - "8554:8554"   # RTSP feeds (go2rtc)
      - "8555:8555"   # WebRTC
      # - "5001:5000" # Internal unauthenticated access — expose carefully

    extra_hosts:
      - "host.docker.internal:host-gateway"  # Enables NPU detector access

    env_file:
      - .env

    # Verifies the NFS media mount is writable and the cameras are producing
    # frames — not just that the web server answers. An NFS server reboot leaves the
    # mount stale, which a plain HTTP check reports as healthy.
    # Works with auth enabled: a 401 from the API counts as alive, and the
    # stream check simply reports "unavailable" rather than failing.
    healthcheck:
      test: ["CMD", "/opt/frigate-scripts/healthcheck.sh"]
      interval: 60s
      timeout: 45s
      retries: 3
      start_period: 180s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Restarts frigate when the healthcheck above marks it unhealthy. Docker does
  # not act on health status on its own — restart: unless-stopped only reacts to
  # process exit, which never happens when the NFS mount goes stale.
  #
  # A container restart is also an NFS remount: the volume is refcounted by the
  # Docker daemon and unmounted when the last container using it stops. That is
  # what clears the stale handles. It only works while frigate is the ONLY
  # container mounting nfs_storage_volume — do not mount it here.
  autoheal:
    container_name: frigate-autoheal
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    network_mode: none
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 120
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # References the external Docker volume created by setup.sh
  nfs_storage_volume:
    external: true
